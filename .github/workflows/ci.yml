name: knflux-ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        name: test and build
        runs-on: ubuntu-latest
        steps:
            - name: chekout repository
              uses: actions/checkout@4.1.7

            - name: setup python
              uses: actions/setup-python@5.1.0
              with:
                  python-version: "3.12"

            - name: run all test cases
              run: python -m unittest discover -s tests -v
